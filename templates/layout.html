<!DOCTYPE html>
<html>

<head>
  <title>Flask App</title>
  <link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}">
</head>

<body>
  <header>
    <div class="container">
      <h1 class="logo">Web App de Kevin</h1>
      <strong>
        <nav>
          <ul class="menu">
            <!--Esta sintaxis para flask activará las funciones de home y about respectivamente-->
            <li><a href="{{ url_for('home') }}">Página principal</a></li>
            <li><a href="{{ url_for('about') }}">Acerca de</a></li>
          </ul>
        </nav>
      </strong>
    </div>
  </header>
  <!--Esto se llama herencia de plantillas, aquí se mostrará el contenido de home o about según corresponda-->
  <div class="container">
    {%block content%}
    {%endblock%}
  </div>
</body>

</html>
